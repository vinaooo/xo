name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Static analysis, unit tests & coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history and tags: the version code is the commit count and the version name comes from the latest tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-37.0
      - uses: gradle/actions/setup-gradle@v4
      # gradle.properties is tuned for a low-RAM dev machine; the runner can afford more memory and parallelism.
      - name: Gradle settings for CI
        run: |
          mkdir -p ~/.gradle
          printf '%s\n' \
            'org.gradle.parallel=true' \
            'org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' \
            'kotlin.daemon.jvmargs=-Xmx1536m' >> ~/.gradle/gradle.properties
      - name: ktlint, detekt, lint
        run: ./gradlew ktlintCheck detekt lintDebug
      # Unit tests also verify the screenshots (roborazzi.test.verify in gradle.properties).
      - name: Unit tests, screenshots + coverage gate
        run: ./gradlew test koverVerify koverXmlReport
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: '**/build/reports/**'
