name: Mutation testing

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  pitest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history: configuring :app reads the version from git, and a shallow clone fails that on purpose.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :domain:pitest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pitest-report
          path: domain/build/reports/pitest/
